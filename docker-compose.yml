# Host networking, so the container answers on both IPv6 and IPv4 without
# needing IPv6 turned on in the Docker daemon. See DEPLOYMENT.md.

services:
  wordle:
    build: .
    image: wordle:1.0.0
    container_name: wordle
    restart: unless-stopped
    network_mode: host
    env_file: .env
    command:
      - uvicorn
      - wordle.app:create_app
      - --factory
      - --host
      - "::"            # dual-stack: answers on IPv6 and IPv4
      - --port
      - "8000"
      - --workers
      - "1"             # must stay 1: games are held in process memory
      - --proxy-headers
      - --forwarded-allow-ips
      - "*"
    deploy:
      resources:
        limits:
          # Generous for this app; leaves the box to Hermes Agent.
          memory: 512M
          cpus: "1.0"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
