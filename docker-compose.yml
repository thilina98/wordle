# Three services: the frontend, the API, and PostgreSQL for player accounts.
# The database is only used when sign-in is configured (WORDLE_AUTH_ISSUER);
# without it the game is anonymous-only and the database sits idle.
#
#   docker compose up -d --build          works everywhere: Linux, Mac, Windows
#
# On the VPS, add the production override to get IPv6 as well:
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# Each application has its own settings file, and nothing is shared:
#   backend/.env   -> the api container   (copy backend/.env.example)
#   frontend/.env  -> the web container   (copy frontend/.env.example)
# Both must exist before `docker compose up`.
#
# Two of those settings are what the *browser* uses, not what the containers
# use. They must be addresses a visitor can actually reach:
#   WORDLE_API_BASE        (frontend/.env) where the browser finds the API
#   WORDLE_ALLOWED_ORIGINS (backend/.env)  where the browser loaded the page
# Get either wrong and the page loads but every request fails.

x-hardening: &hardening
  # No process in either container ever needs to gain privileges.
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  restart: unless-stopped
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

services:
  api:
    <<: *hardening
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: wordle-api:2.1.0
    container_name: wordle-api
    user: "10001:10001"
    ports:
      - "8000:8000"

    # Secrets as files, not environment variables: `docker inspect` and
    # /proc/<pid>/environ both expose the environment, neither exposes these.
    secrets:
      - wordle_database_password
      - wordle_auth0_client_secret

    # The backend's own settings: CORS origin, sign-in, game tuning.
    env_file: ./backend/.env

    # Fixed by how the containers are wired together, so not left to the
    # env file. These win over anything with the same name in it.
    environment:
      WORDLE_ACTIVE_GAMES_DB_PATH: /data/games.db
      WORDLE_ACTIVE_GAMES_STORE: sqlite
      WORDLE_DATABASE_URL: postgresql://wordle@db:5432/wordle

    # Games in progress. Survives `docker compose down`, image rebuilds and
    # the container being destroyed. Removed only by `docker volume rm`.
    volumes:
      - wordle-data:/data

    # The image is immutable at runtime; the only writable path is the volume.
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777

    deploy:
      resources:
        limits: { memory: 512M, cpus: "1.0" }
        reservations: { memory: 128M }

    depends_on:
      db:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u,sys; sys.exit(0 if u.urlopen('http://127.0.0.1:8000/healthz',timeout=2).status==200 else 1)"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

  db:
    <<: *hardening
    image: postgres:17-alpine
    container_name: wordle-db
    # The entrypoint starts as root to fix volume ownership, then drops to the
    # postgres user; these are the capabilities that takes.
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    secrets:
      - wordle_database_password
    environment:
      POSTGRES_USER: wordle
      POSTGRES_DB: wordle
      POSTGRES_PASSWORD_FILE: /run/secrets/wordle_database_password
    # No ports: only the API talks to the database, over the compose network.
    volumes:
      - wordle-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wordle -d wordle"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits: { memory: 256M, cpus: "0.5" }

  web:
    <<: *hardening
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: wordle-web:2.1.0
    container_name: wordle-web
    user: "101:101"
    ports:
      - "8080:8080"

    # WORDLE_API_BASE, rewritten into config.js when the container starts.
    env_file: ./frontend/.env

    read_only: true
    tmpfs:
      # nginx writes its pid and temp bodies here, and the entrypoint writes
      # config.js here. Not the web root: a tmpfs over it would hide the files
      # the image copied in.
      - /tmp:size=16m,mode=1777
      - /var/cache/nginx:size=16m,mode=0770,uid=101,gid=101

    depends_on:
      api:
        condition: service_healthy

    deploy:
      resources:
        limits: { memory: 64M, cpus: "0.5" }


secrets:
  wordle_database_password:
    file: ./secrets/wordle_database_password
  # Must exist; leave it empty unless WORDLE_AUTH_PROVIDER=auth0.
  wordle_auth0_client_secret:
    file: ./secrets/wordle_auth0_client_secret

volumes:
  wordle-data:
    name: wordle-data
  # Player accounts. Back this one up: unlike games in progress, it is the
  # only copy of who owns what.
  wordle-db:
    name: wordle-db
