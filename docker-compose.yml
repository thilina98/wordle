# Two services, run separately, talking over HTTP.
#
# Host networking, so both answer on IPv6 and IPv4 without turning on IPv6 in
# the Docker daemon. See DEPLOYMENT.md.
#
# The two URLs below are what the *browser* uses, not what the containers use.
# They must be addresses a visitor can actually reach:
#   WORDLE_API_BASE        where the browser finds the API   -> baked into config.js
#   WORDLE_ALLOWED_ORIGINS where the browser loaded the page -> the API's CORS list
# Get either wrong and the page loads but every request fails.

services:
  api:
    build: ./backend
    image: wordle-api:2.0.0
    container_name: wordle-api
    restart: unless-stopped
    network_mode: host
    env_file: .env
    command:
      - uvicorn
      - wordle.app:create_app
      - --factory
      - --host
      - "::"            # dual-stack: answers on IPv6 and IPv4
      - --port
      - "8000"
      - --workers
      - "1"             # must stay 1: games are held in process memory
      - --proxy-headers
      - --forwarded-allow-ips
      - "*"
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  web:
    build: ./frontend
    image: wordle-web:2.0.0
    container_name: wordle-web
    restart: unless-stopped
    network_mode: host
    environment:
      # Rewritten into config.js at container start.
      WORDLE_API_BASE: ${WORDLE_API_BASE:-http://localhost:8000}
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: "0.5"
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
