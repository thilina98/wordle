# Serves the static files and nothing else. The API is a separate service on a
# separate origin; this server never proxies to it.

server {
    listen       8080;
    listen  [::]:8080;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # Written at container start by /docker-entrypoint.d/10-api-base.sh.
    # Served from /tmp because the root filesystem is read-only. This takes
    # precedence over the config.js baked into the image.
    location = /config.js {
        alias /tmp/config.js;
        default_type application/javascript;
        add_header Cache-Control "no-store" always;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    gzip              on;
    gzip_types        text/css application/javascript;
    gzip_min_length   512;
}
