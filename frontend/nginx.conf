# Serves the static files and nothing else. The API is a separate service on a
# separate origin; this server never proxies to it.

server {
    listen       8080;
    listen  [::]:8080;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # config.js is rewritten at container start, so it must never be cached.
    location = /config.js {
        add_header Cache-Control "no-store" always;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    gzip              on;
    gzip_types        text/css application/javascript;
    gzip_min_length   512;
}
