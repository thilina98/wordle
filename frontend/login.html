<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Wordle — Sign in</title>
<!-- Styles are inline: /static needs a session, which this page does not have yet. -->
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100dvh; display: grid; place-items: center;
    padding: 24px calc(16px + env(safe-area-inset-right)) 24px calc(16px + env(safe-area-inset-left));
    background: #121213; color: #f8f8f8;
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  form { width: 100%; max-width: 320px; text-align: center; }
  h1 {
    margin: 0 0 4px; font-size: 2rem; letter-spacing: .18em;
    text-transform: uppercase; font-weight: 700;
  }
  p.hint { margin: 0 0 28px; color: #a1a1aa; font-size: .9rem; }
  label { display: block; text-align: left; font-size: .8rem; color: #a1a1aa; margin-bottom: 6px; }
  input {
    width: 100%; padding: 14px; font-size: 1rem; color: inherit;
    background: #1f1f21; border: 1px solid #3a3a3c; border-radius: 8px;
  }
  input:focus-visible { outline: 2px solid #538d4e; outline-offset: 1px; border-color: #538d4e; }
  button {
    width: 100%; margin-top: 14px; padding: 14px; font-size: 1rem; font-weight: 600;
    color: #fff; background: #538d4e; border: 0; border-radius: 8px; cursor: pointer;
  }
  button:hover { background: #4a7d46; }
  .error {
    margin: 16px 0 0; padding: 10px; font-size: .875rem;
    color: #fca5a5; background: #3f1d1d; border-radius: 8px;
  }
</style>
</head>
<body>
  <form method="post" action="/login">
    <h1>Wordle</h1>
    <p class="hint">This site is private. Enter the password to play.</p>
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password"
           required autofocus enterkeyhint="go">
    <button type="submit">Enter</button>
    <!--ERROR-->
  </form>
</body>
</html>
