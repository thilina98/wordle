<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wordle</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <!-- Password Screen -->
        <div id="password-screen" class="screen active">
            <div class="password-box">
                <h1>Wordle</h1>
                <p>Enter password to play</p>
                <input type="password" id="password-input" placeholder="Password" autocomplete="off">
                <button id="password-submit" class="btn-primary">Enter</button>
                <p id="password-error" class="error hidden">Invalid password</p>
            </div>
        </div>

        <!-- Game Screen -->
        <div id="game-screen" class="screen">
            <header>
                <h1>Wordle</h1>
                <div id="attempt-counter" class="attempt-counter">Attempt: <span id="current-attempt">1</span>/5</div>
            </header>

            <!-- Game Grid -->
            <div id="game-grid" class="game-grid" role="grid" aria-label="Wordle guesses">
                <!-- 5 rows x 5 cols will be generated by JS -->
            </div>

            <!-- Message Area -->
            <div id="message" class="message" aria-live="polite"></div>

            <!-- Virtual Keyboard -->
            <div id="keyboard" class="keyboard" role="keyboard" aria-label="Game keyboard">
                <!-- Generated by JS -->
            </div>

            <!-- Game Over Modal -->
            <div id="game-over-modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="modal-title">
                <div class="modal-content">
                    <h2 id="modal-title">Game Over</h2>
                    <p id="modal-message"></p>
                    <p id="modal-word" class="hidden"></p>
                    <button id="play-again" class="btn-primary">Play Again</button>
                </div>
            </div>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
