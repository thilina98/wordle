<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#121213">
<title>Wordle</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Password gate. Shown until the API hands back a token. -->
<section id="gate" class="gate">
  <form id="login-form" autocomplete="on">
    <h1>Wordle</h1>
    <p class="hint">This game is private. Enter the password to play.</p>
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password"
           required autofocus enterkeyhint="go">
    <button class="primary" type="submit">Enter</button>
    <p id="login-error" class="error" role="alert" hidden></p>
  </form>
</section>

<!-- The game. Hidden until the gate is passed. -->
<section id="game" class="game" hidden>
  <header class="bar">
    <h1>Wordle</h1>
    <button id="signout" class="link" type="button">Sign out</button>
  </header>

  <main>
    <!-- Tiles and keys are built by app.js from the board the API returns. -->
    <div id="board" class="board" role="grid" aria-label="Guesses"></div>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <div id="keyboard" class="keyboard" aria-label="Keyboard"></div>
  </main>

  <div id="result" class="result" hidden>
    <div class="card" role="dialog" aria-modal="true" aria-labelledby="result-title">
      <h2 id="result-title"></h2>
      <p id="result-text"></p>
      <button id="again" class="primary" type="button">Play again</button>
    </div>
  </div>
</section>

<script src="config.js"></script>
<script src="api.js"></script>
<script src="app.js"></script>
</body>
</html>
