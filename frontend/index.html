<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#121213">
<title>Wordle</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- The game. Anyone can play, no account needed. -->
<section id="game" class="game">
  <header class="bar">
    <h1>Wordle</h1>

    <!-- Signing in is optional. Hidden entirely when sign-in is not set up. -->
    <nav id="account" class="account" aria-label="Account" hidden>
      <button id="sign-in" class="bar-button" type="button" hidden>Sign in</button>
      <div id="player" class="player" hidden>
        <button id="player-button" class="bar-button" type="button"
                aria-haspopup="menu" aria-expanded="false" aria-controls="player-menu">
          <span id="player-name" class="player-name"></span>
          <span class="caret" aria-hidden="true">&#9662;</span>
        </button>
        <div id="player-menu" class="menu" role="menu" hidden>
          <button id="sign-out" type="button" role="menuitem">Sign out</button>
          <button id="delete-account" class="menu-danger" type="button" role="menuitem">Delete account</button>
        </div>
      </div>
    </nav>
  </header>

  <main>
    <!-- Tiles and keys are built by app.js from the board the API returns. -->
    <div id="board" class="board" role="grid" aria-label="Guesses"></div>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <div id="keyboard" class="keyboard" aria-label="Keyboard"></div>
  </main>

  <div id="result" class="result" hidden>
    <div class="card" role="dialog" aria-modal="true" aria-labelledby="result-title">
      <h2 id="result-title"></h2>
      <p id="result-score" class="score" hidden></p>
      <p id="result-text"></p>
      <button id="again" class="primary" type="button">Play again</button>
    </div>
  </div>
</section>

<div id="confirm-delete" class="result" hidden>
  <div class="card card-centred" role="alertdialog" aria-modal="true"
       aria-labelledby="delete-title" aria-describedby="delete-text">
    <h2 id="delete-title">Delete account?</h2>
    <p id="delete-text">Your player, your games and your sign-in are removed for good.
      You can sign up again later, starting from nothing.</p>
    <div class="actions">
      <button id="delete-cancel" class="secondary" type="button">Cancel</button>
      <button id="delete-confirm" class="danger" type="button">Delete</button>
    </div>
  </div>
</div>

<script src="config.js"></script>
<script src="vendor/oidc-client-ts-3.4.1.min.js"></script>
<script src="auth.js"></script>
<script src="api.js"></script>
<script src="app.js"></script>
</body>
</html>
