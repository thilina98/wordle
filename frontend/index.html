<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#121213">
<title>Wordle</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- The game. Anyone can play, no account needed. -->
<section id="game" class="game">
  <header class="bar">
    <h1>Wordle</h1>
  </header>

  <main>
    <!-- Tiles and keys are built by app.js from the board the API returns. -->
    <div id="board" class="board" role="grid" aria-label="Guesses"></div>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <div id="keyboard" class="keyboard" aria-label="Keyboard"></div>
  </main>

  <div id="result" class="result" hidden>
    <div class="card" role="dialog" aria-modal="true" aria-labelledby="result-title">
      <h2 id="result-title"></h2>
      <p id="result-score" class="score" hidden></p>
      <p id="result-text"></p>
      <button id="again" class="primary" type="button">Play again</button>
    </div>
  </div>
</section>

<script src="config.js"></script>
<script src="api.js"></script>
<script src="app.js"></script>
</body>
</html>
