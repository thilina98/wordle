# Development override. Use with:
#
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml watch
#
# `watch` syncs edits straight into the running containers, so a change to a
# .py or .js file shows up without a rebuild. It needs a writable filesystem,
# which is why the hardening in the base file is relaxed here and only here.
#
# It also publishes ports instead of using host networking. On Docker Desktop
# for Mac and Windows, `network_mode: host` puts the container on the Linux
# VM's network, not the machine's, so localhost:8000 reaches nothing. The base
# file keeps host networking because that is what the Linux VPS wants.

services:
  api:
    read_only: false
    network_mode: bridge
    ports:
      - "8000:8000"
    environment:
      # Reloads on edit; never use this in production.
      WORDLE_ALLOWED_ORIGINS: http://localhost:8080,http://127.0.0.1:8080
    develop:
      watch:
        - action: sync+restart
          path: ./backend/wordle
          target: /usr/local/lib/python3.13/site-packages/wordle
          ignore:
            - __pycache__/
        # A dependency change cannot be synced in; rebuild instead.
        - action: rebuild
          path: ./backend/pyproject.toml

  web:
    read_only: false
    network_mode: bridge
    ports:
      - "8080:8080"
    depends_on: !reset []
    develop:
      watch:
        - action: sync
          path: ./frontend
          target: /usr/share/nginx/html
          ignore:
            - Dockerfile
            - .dockerignore
            - nginx.conf
            - docker-entrypoint.d-10-api-base.sh
        # Server config is read once at start, so it needs a restart.
        - action: sync+restart
          path: ./frontend/nginx.conf
          target: /etc/nginx/conf.d/default.conf
